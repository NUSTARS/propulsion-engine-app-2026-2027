<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>engiNUity</title>
    <link rel="stylesheet" type="text/css" href="style.css">
  </head>
  <body id="testSequenceBody">
    <div id="pageHeaderDiv">
      <button onclick="electronAPI.sendLoadMain('setup_renderer.html')">Home Button</button>
      <h1 id="pageHeader">engi<font color="#4E2A84">NU</font>ity</h1>
    </div>
    <div id="testSequenceDiv">


      <!-- Area where blocks can be selected to be added to drag area (left column) -->
      <div id="pieceArea">


        <div class="actionBlocks">
          <button onclick="createDraggableDiv(this)" id="turnOnBlock">Turn On</button>
          <button onclick="createDraggableDiv(this)" id="startFlowBlock">Allow Flow of</button>
          <button onclick="createDraggableDiv(this)" id="stopFlowBlock">Stop Flow of</button>
          <button onclick="createDraggableDiv(this)" id="waitSecondsBlock">Wait _ Seconds</button>
        </div>

        <div class="variableBlocks">
          <button onclick="createDraggableDiv(this)" id="ethanolVariable">Ethanol</button>
          <button onclick="createDraggableDiv(this)" id="oxygenVariable">Oxygen</button>
          <button onclick="createDraggableDiv(this)" id="sparkplugVariable">Sparkplug</button>
        </div>


      </div>


      <!-- Main area where blocks are dragged into/put in sequence (center column) -->
      <div id="dragArea">
        <div id="startBlock">Start Block</div>



      </div>


      <!-- Area with specific sequence select and create new file button -->
      <div id="sequenceSelectArea">
        <button onclick="updateSavedSequenceButtons()">Refresh Saved Sequences</button>
        <div id="savedSequencesDisplay">
          
        </div>
        <input type="text" id="filenameInput" placeholder="Input filename..."/>
        <button onclick="saveCurrentSequence()">Save Current Sequence</button>
      </div>


        
    </div>
  </body>


  <div id="blockCloneStorage">


    <!-- WAIT # SECOND(S) BLOCK -->
    <div class="draggableItem" id="waitSecondsBlockClone">
      Wait
      <input type="text" placeholder="#..." />
      Second(s)
    </div>


  </div>


  <script src="./test_sequence_editor.js"></script>
</html>
