<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>engiNUity</title>
    <link rel="stylesheet" type="text/css" href="style.css">
  </head>
  <body id="testSequenceBody">
    <div id="pageHeaderDiv">
      <button onclick="electronAPI.sendLoadMain('setup_renderer.html')">Home Button</button>
      <h1 id="pageHeader">engi<font color="#4E2A84">NU</font>ity</h1>
    </div>
    <div id="testSequenceDiv">


      <!-- Area where blocks can be selected to be added to drag area (left column) -->
      <div id="pieceArea">


        <div class="actionBlocks">
          <button onclick="createDraggableDiv(this.id)" id="turnOnBlock">Turn On</button>
          <button onclick="createDraggableDiv(this.id)" id="turnOffBlock">Turn Off</button>
          <button onclick="createDraggableDiv(this.id)" id="beginFlowBlock">Begin Flow of _ </button>
          <button onclick="createDraggableDiv(this.id)" id="endFlowBlock">End Flow of _ </button>
          <button onclick="createDraggableDiv(this.id)" id="waitSecondsBlock">Wait _ Seconds</button>
        </div>


      </div>


      <!-- Main area where blocks are dragged into/put in sequence (center column) -->
      <div id="dragArea">
        <div id="startBlock">Start Block</div>



      </div>


      <!-- Area with specific sequence select and create new file button -->
      <div id="sequenceSelectArea">
        <button onclick="updateSavedSequenceButtons()">Refresh Saved Sequences</button>
        <div id="savedSequencesDisplay">
          
        </div>
        <input type="text" id="filenameInput" placeholder="Input filename..."/>
        <button onclick="saveCurrentSequence()">Save Current Sequence</button>
      </div>


        
    </div>
  </body>


  <div style="display: none;" id="blockCloneStorage">


    <!-- BEGIN FLOW OF BLOCK -->
    <div class="draggableItem" id="beginFlowBlockClone">
      Begin Flow of
      <select>
        <option value="ethanol">Ethanol</option>
        <option value="oxygen">Oxygen</option>
      </select>
    </div>


    <!-- END FLOW OF BLOCK -->
    <div class="draggableItem" id="endFlowBlockClone">
      End Flow of
      <select>
        <option value="ethanol">Ethanol</option>
        <option value="oxygen">Oxygen</option>
      </select>
    </div>


    <!-- WAIT # SECOND(S) BLOCK -->
    <div class="draggableItem" id="waitSecondsBlockClone">
      Wait
      <input style="width: 50px;" type="text" placeholder="#..." />
      Second(s)
    </div>


    <!-- TURN ON BLOCK -->
    <div class="draggableItem" id="turnOnBlockClone">
      Turn On
      <select>
        <option value="sparkplug">Sparkplug</option>
      </select>
    </div>


    <!-- TURN OFF BLOCK -->
    <div class="draggableItem" id="turnOffBlockClone">
      Turn Off
      <select>
        <option value="sparkplug">Sparkplug</option>
      </select>
    </div>


  </div>


  <script src="./test_sequence_editor.js"></script>
</html>
